[project]
name = "hayeon-music"
version = "0"
requires-python = "==3.11.18"
dependencies = [
    "basic-pitch[onnx]==0.4.0",
    # Tested with the default htdemucs loader at adefossez/HTDemucs revision cbc8a9b1a87023b7fd74e7b3412e6321c0eab003.
    "demucs==4.1.0",
    "librosa==0.11.0",
    "mido==1.3.3",
    "numpy==1.26.4",
    "onnxruntime==1.32.0",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "torch==2.15.0+cpu",
    "torchaudio==2.11.1+cpu",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'"]
# Basic Pitch requires resampy <0.4.3, which imports pkg_resources.
constraint-dependencies = ["setuptools<82"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
