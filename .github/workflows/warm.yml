name: Warm the gateways

# hayeon.eth is served through eth.limo and eth.link. Those gateways answer in
# about a second once they hold a file, but need many seconds the first time one
# of their nodes is asked for it. This job asks for every file a few times after
# each release, so that visitors are not the ones who wait.
#
# Before that it spreads the newest IPNS record. 4EVERLAND stores each new record
# on only some of the DHT peers nearest to the name; the others keep the previous
# one for a day, and a gateway that asks them serves the previous release.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm
  cancel-in-progress: true

env:
  IPNS_NAME: k51qzi5uqu5djosu5m6aionypxo0mv5mmytg12o3u08swhkd8qrxmtooz73ngi

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/ipns-refresh/go.mod
          cache-dependency-path: tools/ipns-refresh/go.sum

      - name: Build the IPNS refresh tool
        working-directory: tools/ipns-refresh
        run: go build -mod=readonly -o "$RUNNER_TEMP/ipns-refresh" .

      - name: Spread the newest record to the peers nearest to the name
        working-directory: tools/ipns-refresh
        env:
          PUSHED_AT: ${{ github.event.repository.pushed_at }}
        run: |
          # After a push, wait until the record for this release shows up (4EVERLAND
          # publishes a minute or two after the push), then spread that one.
          after=()
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$PUSHED_AT" ]; then
            after=(-published-after "$(date -u -d "@$PUSHED_AT" +%Y-%m-%dT%H:%M:%SZ)")
          fi
          "$RUNNER_TEMP/ipns-refresh" -name "$IPNS_NAME" "${after[@]}" 2>&1 | grep -v -i -e warn -e resource || true

      - name: Ask both gateways for every file
        run: |
          # The page itself, the pack of photos and music that the build adds, then
          # everything in public/ (sw.js, icons and the single photos and songs).
          { echo index.html; echo pack.bin; find public -type f -printf '%P\n'; } > files.txt

          warm() {
            for host in hayeon.eth.limo hayeon.eth.link; do
              for round in 1 2 3 4 5 6; do
                curl -sS -o /dev/null --compressed --max-time 90 -w "%{http_code} %{time_total}s $host/\n" "https://$host/" || true
                xargs -P 6 -I{} curl -sS -o /dev/null --compressed --max-time 90 \
                  -w "%{http_code} %{time_total}s $host/{}\n" "https://$host/{}" < files.txt || true
              done
            done
          }

          warm
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Gateway nodes switch to a new release up to five minutes apart.
            sleep 300
            warm
          fi
